{% extends 'catalog/base.html' %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Удаление товара</h1>
    <div class="alert alert-warning">
        <p>Вы уверены, что хотите удалить товар <strong>{{ product.name }}</strong>?</p>
        <p>Это действие необратимо.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
