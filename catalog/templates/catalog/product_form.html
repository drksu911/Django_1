{% extends 'catalog/base.html' %}

{% block title %}{% if object %}Редактирование товара{% else %}Добавление товара{% endif %}{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">{% if object %}Редактирование товара{% else %}Добавление нового товара{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% if object %}{% url 'product_detail' object.pk %}{% else %}{% url 'home' %}{% endif %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
