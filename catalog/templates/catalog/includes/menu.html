<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'blog_list' %}">Блог</a>

        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-info" href="{% url 'profile' %}">Профиль</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger p-2">Выйти</button>
            </form>
        {% else %}
            <a class="p-2 btn btn-outline-secondary" href="{% url 'login' %}">Вход</a>
            <a class="p-2 btn btn-outline-secondary" href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
