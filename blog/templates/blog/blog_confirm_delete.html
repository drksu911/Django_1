{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Удаление статьи</h1>
    <p>Вы уверены, что хотите удалить статью "{{ blog.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog_detail' blog.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
